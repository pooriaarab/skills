name: coverage-ratchet
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: coverage-ratchet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Produce coverage
        run: bun run test:coverage
      - name: Gate (PR, advisory) / bump baseline (main)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node .github/scripts/coverage-gate.mjs update
            git add .coverage-baseline.json
            if ! git diff --cached --quiet -- .coverage-baseline.json; then
              git config user.name "coverage-bot"
              git config user.email "coverage-bot@users.noreply.github.com"
              git commit -m "chore: bump coverage baseline [skip ci]"
              git push
            fi
          else
            node .github/scripts/coverage-gate.mjs check
          fi
