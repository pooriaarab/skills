name: vibecodereview
on:
  pull_request:
    types: [opened, synchronize, review_requested]
    # No paths-ignore here. The fleet's code repos skip "**.md" because a
    # README-only change does not need a council. In this repo markdown IS the
    # product: 238 SKILL.md files out of 261 tracked files. That ignore list
    # excluded everything, so this workflow never started and pull requests
    # merged looking reviewed when only CodeRabbit and Kilo had run.
concurrency:
  group: vibecodereview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  vibecodereview:
    # Only review the repo owner's own PRs (cost + injection guard on public repos).
    if: github.event.pull_request.user.login == github.repository_owner
    # Public repo: GitHub-hosted minutes are free here, so the fleet's
    # Ubicloud rule (which covers the private repos) does not apply.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: pooriaarab/vibecodereview@v1
        with:
          vibetrace_ingest_url: ${{ secrets.VIBETRACE_INGEST_URL }}
          vibetrace_ingest_token: ${{ secrets.VIBETRACE_INGEST_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_code_oauth_token_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          github_token: ${{ github.token }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          moonshot_api_key: ${{ secrets.MOONSHOT_API_KEY }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}